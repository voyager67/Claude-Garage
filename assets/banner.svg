<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Claude Garage banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b1230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#ffc857"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- garage door -->
  <g transform="translate(880 150)" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round">
    <path d="M0 120 L170 0 L340 120 V340 H0 Z"/>
    <path d="M40 180 H300 M40 225 H300 M40 270 H300 M40 315 H300" opacity="0.85"/>
  </g>
  <text x="90" y="250" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#8b949e" letter-spacing="6">OPEN SOURCE  ·  CLAUDE CODE PLUGIN</text>
  <text x="90" y="350" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="108" font-weight="800" fill="#ffffff">Claude Garage</text>
  <rect x="94" y="378" width="260" height="8" rx="4" fill="url(#accent)"/>
  <text x="90" y="450" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" fill="#e6edf3">Ship like a ten-person startup.</text>
  <text x="90" y="500" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" fill="#e6edf3">Alone. From your terminal.</text>
  <text x="90" y="570" font-family="'SFMono-Regular', Consolas, monospace" font-size="26" fill="#ffc857">13 agents  ·  20 commands  ·  0 config</text>
</svg>
